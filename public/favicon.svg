<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .s-letter {
      animation: s-glow 2.2s ease-in-out infinite;
      transform-origin: 32px 32px;
    }
    .cursor {
      animation: s-blink 1s steps(1, end) infinite;
    }
    @keyframes s-glow {
      0%, 100% { fill: #38e1ff; filter: drop-shadow(0 0 1px rgba(56, 225, 255, 0.4)); }
      50% { fill: #3ddc84; filter: drop-shadow(0 0 5px rgba(61, 220, 132, 0.75)); }
    }
    @keyframes s-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0a0e15" stroke="#2b3645" stroke-width="2" />

  <text
    x="20"
    y="45"
    font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
    font-weight="700"
    font-size="34"
    class="s-letter"
  >S</text>

  <rect class="cursor" x="41" y="19" width="7" height="27" rx="1.5" fill="#3ddc84" />
</svg>
